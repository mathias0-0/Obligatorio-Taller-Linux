---
- name: Instalar Apache, PHP y herramientas SELinux
  ansible.builtin.dnf:
    name: 
      - httpd
      - php
      - php-mysqlnd
      - policycoreutils-python-utils
    state: present

- name: Asegurar que Apache esté iniciado
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true

- name: Instalar Git
  ansible.builtin.dnf:
    name: git
    state: present

- name: Descargar aplicación
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: /opt/dbappphp
    version: main

- name: Crear directorio web
  ansible.builtin.file: 
    path: /var/www/html 
    state: directory 
    owner: root 
    group: apache 
    mode: "0755"

- name: Copiar archivos de la aplicación
  ansible.builtin.copy: 
    src: "/opt/dbappphp/{{ item }}"
    dest: "/var/www/html/{{ item }}"
    remote_src: true 
    owner: root 
    group: apache 
    mode: "0644" 
  loop: 
    - cumple.php
    - cumpleanios.sql 
    - README.md 
    - LICENSE

- name: Configurar contexto SELinux para la aplicación
  community.general.sefcontext:
    target: '/var/www/html(/.*)?'
    setype: httpd_sys_content_t
    state: present
  register: selinux_context

- name: Aplicar contexto SELinux
  ansible.builtin.command:
    cmd: restorecon -Rv /var/www/html
  when: selinux_context.changed

- name: Permitir conexiones de Apache a MariaDB
  ansible.posix.seboolean:
    name: httpd_can_network_connect_db
    state: true
    persistent: true

- name: Configurar conexión de la aplicación
  ansible.builtin.lineinfile:
    path: /var/www/html/cumple.php
    regexp: '^\$conexion = new mysqli'
    line: '$conexion = new mysqli("{{ db_host }}", "{{ db_user }}", "{{ db_password }}", "{{ db_name }}");'

- name: Permitir HTTP en firewalld
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled
