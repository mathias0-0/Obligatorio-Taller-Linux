---
- name: Instalar Apache
  ansible.builtin.dnf:
    name: httpd
    state: present

- name: Instalar PHP y extensión MariaDB
  ansible.builtin.dnf:
    name:
      - php
      - php-mysqlnd
    state: present

- name: Asegurar que Apache esté iniciado
  ansible.builtin.service:
    name: httpd
    state: started
    enabled: true

- name: Instalar Git
  ansible.builtin.dnf:
    name: git
    state: present

- name: Descargar aplicación
  ansible.builtin.git:
    repo: "{{ app_repo }}"
    dest: /opt/dbappphp
    version: main

- name: Crear directorio web
  ansible.builtin.file: 
    path: /var/www/html 
    state: directory 
    owner: root 
    group: apache 
    mode: "0755"



- name: Copiar archivos de la aplicación
  ansible.builtin.copy: 
    src: "/opt/dbappphp/{{ item }}"
    dest: "/var/www/html/{{ item }}"
    remote_src: true 
    owner: root 
    group: apache 
    mode: "0644" 
  loop: 
    - cumpleanios.sql 
    - README.md 
    - LICENSE

- name: Configurar conexión de la aplicación
  ansible.builtin.template:
    src: cumple.php.j2 
    dest: /var/www/html/cumple.php 
    owner: root 
    group: apache 
    mode: "0644"

- name: Permitir HTTP en firewalld
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled

- name: Configurar conexión de la aplicación
  ansible.builtin.template:
    src: cumple.php.j2
    dest: /var/www/html/cumple.php
    owner: root
    group: apache
    mode: "0644"
