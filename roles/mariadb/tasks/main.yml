---
- name: Instalar MariaDB Server
  ansible.builtin.apt:
    name: mariadb-server
    state: present
    update_cache: true

- name: Asegurar que MariaDB esté iniciado
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Crear base de datos
  community.mysql.mysql_db:
    name: "{{ db_name }}"
    state: present

- name: Crear usuario de la aplicación
  community.mysql.mysql_user:
    name: "{{ db_user }}"
    password: "{{ db_password }}"
    priv: "{{ db_name }}.*:ALL"
    host: "{{ db_allowed_host }}"
    state: present

- name: Configurar acceso remoto de MariaDB
  ansible.builtin.template:
    src: 50-server.cnf.j2
    dest: /etc/mysql/mariadb.conf.d/50-server.cnf
    owner: root
    group: root
    mode: "0644"
  notify: Reiniciar MariaDB

- name: Permitir SSH
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp

- name: Permitir MariaDB desde el servidor de aplicación
  community.general.ufw:
    rule: allow
    port: "3306"
    proto: tcp
    from_ip: "{{ db_allowed_host }}"

- name: Activar UFW
  community.general.ufw:
    state: enabled
